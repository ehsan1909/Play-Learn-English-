name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found: app/build.gradle is missing."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build Android APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayAndLearn-English-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
